<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="800" height="1150" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1150" fill="#fefce8" />
  <rect x="20" y="20" width="760" height="1110" rx="28" fill="#ffffff" stroke="#0f172a" stroke-width="4" filter="url(#cardShadow)" />

  <!-- Top Title Banner -->
  <g transform="translate(180, 45)">
    <rect x="0" y="0" width="440" height="75" rx="24" fill="#fbbf24" stroke="#0f172a" stroke-width="4" />
    <text x="220" y="50" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2px">7/C SINIFI</text>
  </g>
  <text x="400" y="150" font-size="38" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3px">SINIF KURALLARI</text>

  <!-- Slogan -->
  <g transform="translate(240, 168)">
    <rect x="0" y="0" width="320" height="32" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
    <text x="160" y="21" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">Daha iyi bir sınıf, daha güzel bir gelecek!</text>
  </g>

  <!-- Corner Illustrations -->
  <text x="60" y="100" font-size="36">📚</text>
  <text x="700" y="100" font-size="36">✏️</text>

  <!-- ==================== 10 RULES ==================== -->

  <!-- Rule 1: Zamanında Gel -->
  <g transform="translate(45, 220)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#fff1f2" stroke="#fecdd3" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#f43f5e" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    <text x="75" y="42" font-size="19" font-weight="900" fill="#0f172a">Zamanında Gel.</text>
    <text x="290" y="44" font-size="24">⏰</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Ders başlamadan önce sınıfta hazır ol.</tspan>
      <tspan x="25" dy="20">Geç kalma, arkadaşlarının ve öğretmeninin</tspan>
      <tspan x="25" dy="20">zamanına saygı duy.</tspan>
    </text>
  </g>

  <!-- Rule 2: Derse Hazırlıklı Gel -->
  <g transform="translate(410, 220)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#059669" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    <text x="75" y="42" font-size="19" font-weight="900" fill="#0f172a">Derse Hazırlıklı Gel.</text>
    <text x="295" y="44" font-size="24">📚</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Defterini, kitabını ve gerekli araç gereçlerini</tspan>
      <tspan x="25" dy="20">unutma. Hazırlıklı gelmek başarını</tspan>
      <tspan x="25" dy="20">artırır.</tspan>
    </text>
  </g>

  <!-- Rule 3: Saygılı Ol -->
  <g transform="translate(45, 380)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#0284c7" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    <text x="75" y="42" font-size="19" font-weight="900" fill="#0f172a">Saygılı Ol.</text>
    <text x="290" y="44" font-size="24">🤝</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Öğretmenlerine, arkadaşlarına ve okul</tspan>
      <tspan x="25" dy="20">çalışanlarına karşı saygılı davran.</tspan>
      <tspan x="25" dy="20">Nazik ve kibar ol.</tspan>
    </text>
  </g>

  <!-- Rule 4: Dinle ve Söz Hakkına Saygı Duy -->
  <g transform="translate(410, 380)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#fffbeb" stroke="#fde68a" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#d97706" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
    <text x="75" y="35" font-size="16" font-weight="900" fill="#0f172a">Dinle ve Söz</text>
    <text x="75" y="52" font-size="16" font-weight="900" fill="#0f172a">Hakkına Saygı Duy.</text>
    <text x="295" y="44" font-size="24">✋</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Konuşan arkadaşını ve öğretmenini dikkatle</tspan>
      <tspan x="25" dy="20">dinle. Söz almak için el kaldır.</tspan>
    </text>
  </g>

  <!-- Rule 5: Sınıfı Temiz Tut -->
  <g transform="translate(45, 540)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#9333ea" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
    <text x="75" y="42" font-size="19" font-weight="900" fill="#0f172a">Sınıfı Temiz Tut.</text>
    <text x="290" y="44" font-size="24">🗑️</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Sıralarını, sınıfını ve okul eşyalarını temiz</tspan>
      <tspan x="25" dy="20">kullan. Çöplerini çöp kutusuna at.</tspan>
    </text>
  </g>

  <!-- Rule 6: Teknolojiyi Doğru Kullan -->
  <g transform="translate(410, 540)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#0d9488" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">6</text>
    <text x="75" y="35" font-size="16" font-weight="900" fill="#0f172a">Teknolojiyi Doğru</text>
    <text x="75" y="52" font-size="16" font-weight="900" fill="#0f172a">Kullan.</text>
    <text x="295" y="44" font-size="24">📵</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Telefonunu ve diğer dijital cihazlarını</tspan>
      <tspan x="25" dy="20">derslerde izinsiz kullanma. Teknoloji,</tspan>
      <tspan x="25" dy="20">öğrenmen için bir araçtır.</tspan>
    </text>
  </g>

  <!-- Rule 7: Güzel Bir İletişim Dili Kullan -->
  <g transform="translate(45, 700)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#ec4899" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">7</text>
    <text x="75" y="35" font-size="16" font-weight="900" fill="#0f172a">Güzel Bir İletişim</text>
    <text x="75" y="52" font-size="16" font-weight="900" fill="#0f172a">Dili Kullan.</text>
    <text x="290" y="44" font-size="24">😊</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Küfür etme, kırıcı ve kaba sözler söyleme.</tspan>
      <tspan x="25" dy="20">Daha saygılı, nazik ve anlayışlı ol.</tspan>
    </text>
  </g>

  <!-- Rule 8: Şiddet ve Zorbalığa Hayır -->
  <g transform="translate(410, 700)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#7c3aed" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">8</text>
    <text x="75" y="35" font-size="16" font-weight="900" fill="#0f172a">Şiddet ve Zorbalığa</text>
    <text x="75" y="52" font-size="16" font-weight="900" fill="#0f172a">Hayır.</text>
    <text x="295" y="44" font-size="24">🚫</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Kimseye fiziksel, sözel ya da dijital şiddet</tspan>
      <tspan x="25" dy="20">uygulama. Herkesin kendini güvende</tspan>
      <tspan x="25" dy="20">hissetmeye hakkı vardır.</tspan>
    </text>
  </g>

  <!-- Rule 9: Kurallara Uygun Davran -->
  <g transform="translate(45, 860)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#f7fee7" stroke="#d9f99d" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#65a30d" />
    <text x="38" y="47" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>
    <text x="75" y="35" font-size="16" font-weight="900" fill="#0f172a">Kurallara Uygun</text>
    <text x="75" y="52" font-size="16" font-weight="900" fill="#0f172a">Davran.</text>
    <text x="290" y="44" font-size="24">📋</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Okulun ve sınıfın kurallarına uymak,</tspan>
      <tspan x="25" dy="20">herkesin hakkını korur ve düzeni sağlar.</tspan>
    </text>
  </g>

  <!-- Rule 10: Birlikte Daha Güçlüyüz -->
  <g transform="translate(410, 860)">
    <rect x="0" y="0" width="345" height="140" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5" />
    <circle cx="38" cy="40" r="22" fill="#2563eb" />
    <text x="38" y="47" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">10</text>
    <text x="75" y="35" font-size="16" font-weight="900" fill="#0f172a">Birlikte Daha</text>
    <text x="75" y="52" font-size="16" font-weight="900" fill="#0f172a">Güçlüyüz.</text>
    <text x="295" y="44" font-size="24">👥</text>
    <text x="25" y="80" font-size="13.5" font-weight="500" fill="#334155">
      <tspan x="25" dy="0">Arkadaşlarına destek ol. Takım ruhunu</tspan>
      <tspan x="25" dy="20">yaşat. İyi bir sınıf, iyi bir arkadaşlıkla</tspan>
      <tspan x="25" dy="20">mümkün.</tspan>
    </text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(160, 1030)">
    <rect x="0" y="0" width="480" height="60" rx="20" fill="#facc15" stroke="#0f172a" stroke-width="3" />
    <text x="240" y="37" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle">
      Sınıfımızın kuralları, hepimizin sorumluluğu! 😊
    </text>
  </g>
</svg>
